# =====================================================================
# 数据集定义 (Ultralytics YOLO 格式)
# 路径相对 path；把你的图片和 YOLO txt 标注放到对应目录。
# =====================================================================
path: ../dataset          # 数据集根目录（相对本 yaml 所在位置，按需改成绝对路径）

train: images/train       # 训练集图片目录
val:   images/val         # 验证集图片目录
test:  images/test        # 测试集图片目录（总 test，分天气子集见失败分析脚本）

# 类别（索引: 名称）
names:
  0: apple
  # 若分成熟度：
  # 0: ripe
  # 1: unripe

# ---- 期望的目录结构 ----
# dataset/
#   images/
#     train/           *.jpg
#     val/             *.jpg
#     test/            *.jpg              (总 test，用于常规评估)
#       sunny/  rainy/  foggy/  lowlight/ (分天气子集，用于失败分析)
#   labels/
#     train/           *.txt   (YOLO格式: class cx cy w h，归一化0~1)
#     val/             *.txt
#     test/            *.txt
#       sunny/ rainy/ foggy/ lowlight/    (与图片子集对应)
